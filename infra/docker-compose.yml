name: marketing

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  n8n:
    image: n8nio/n8n:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB}
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_HOST: ${N8N_DOMAIN}
      N8N_PORT: 5678
      N8N_PROTOCOL: https
      N8N_PROXY_HOPS: 1
      WEBHOOK_URL: https://${N8N_DOMAIN}/
      N8N_EDITOR_BASE_URL: https://${N8N_DOMAIN}/
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_HIRING_BANNER_ENABLED: "false"
      N8N_DEFAULT_LOCALE: ru-RU
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "72"
      EXECUTIONS_DATA_PRUNE_MAX_COUNT: "5000"
      GENERIC_TIMEZONE: ${TIMEZONE}
      TZ: ${TIMEZONE}
    volumes:
      - n8n_data:/home/node/.n8n
    expose:
      - "5678"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - n8n
    ports:
      - "80:80"
      - "443:443"
    environment:
      N8N_DOMAIN: ${N8N_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./dzen:/srv/dzen:ro
      - caddy_data:/data
      - caddy_config:/config

  cardrender:
    build: ../services/cardrender
    restart: unless-stopped
    expose:
      - "8000"
    ports:
      - "127.0.0.1:8100:8000"
    shm_size: "256mb"
    mem_limit: 900m

  smm:
    build: ../services/ai_smm
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      cardrender:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      TELEGRAM_RELAY_BASE: ${TELEGRAM_RELAY_BASE}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_MARKETING_BOT_TOKEN}
      TELEGRAM_ADMIN_CHAT_ID: ${TELEGRAM_ADMIN_CHAT_ID}
      TELEGRAM_CHANNEL_ID: ${TELEGRAM_CHANNEL_ID}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL}
      CARD_RENDER_URL: http://cardrender:8000
      MEDIA_BASE_URL: http://smm:8000/media
      UPLOADS_DIR: /data/uploads
      MAX_BOT_TOKEN: ${MAX_BOT_TOKEN}
      MAX_CHAT_ID: ${MAX_CHAT_ID}
      VK_TOKEN: ${VK_TOKEN}
      VK_GROUP_ID: ${VK_GROUP_ID}
      DZEN_DIR: /srv/dzen
      DZEN_PUBLIC_BASE: https://dzen.saoneclick.ru
      SMM_TEST_TOKEN: ${SMM_TEST_TOKEN}
      TIMEZONE: ${TIMEZONE}
    volumes:
      - ./uploads:/data/uploads
      - ./dzen:/srv/dzen
    expose:
      - "8000"
    ports:
      - "127.0.0.1:8101:8000"
    mem_limit: 512m

volumes:
  pgdata:
  redisdata:
  n8n_data:
  caddy_data:
  caddy_config:
