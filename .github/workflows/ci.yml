name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  ai-smm:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ai_smm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m compileall -q services/ai_smm services/cardrender
